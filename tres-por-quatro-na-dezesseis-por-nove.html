    // Processador estrito de linhas
    function parseGrid(text) {
      // Subsitui espaços inquebráveis e divide preservando o número exato de caracteres por linha
      const cleanText = text.replace(/\u00A0/g, ' ');
      const lines = cleanText.split('\n');
      let maxLen = 0;
      
      lines.forEach(line => {
        if (line.length > maxLen) maxLen = line.length;
      });

      return lines.map(line => {
        return line.padEnd(maxLen, ' ');
      });
    }

    const linesTop = parseGrid(rawTop);
    const linesBottom = parseGrid(rawBottom);

    const container = document.getElementById('ascii-container');
    const fragment = document.createDocumentFragment();

    let isMouseDown = false;

    window.addEventListener('pointerdown', () => isMouseDown = true);
    window.addEventListener('pointerup', () => isMouseDown = false);

    function revealSpan(el) {
      if (el && el.dataset && !el.classList.contains('revealed')) {
        const r = el.dataset.r;
        const c = el.dataset.c;
        if (linesBottom[r] && linesBottom[r][c] !== undefined) {
          el.textContent = linesBottom[r][c];
        }
        el.classList.add('revealed');
      }
    }

    // Renderiza a estrutura alinhando caractere a caractere
    linesTop.forEach((lineStr, r) => {
      for (let c = 0; c < lineStr.length; c++) {
        const span = document.createElement('span');
        span.className = 'ascii-char';
        span.textContent = lineStr[c];
        span.dataset.r = r;
        span.dataset.c = c;

        span.addEventListener('pointerdown', (e) => {
          isMouseDown = true;
          revealSpan(e.target);
        });

        span.addEventListener('pointerenter', (e) => {
          if (isMouseDown) {
            revealSpan(e.target);
          }
        });

        fragment.appendChild(span);
      }
      fragment.appendChild(document.createTextNode('\n'));
    });

    container.appendChild(fragment);

    // Suporte para touch e arrasto continuo suave
    container.addEventListener('pointermove', (e) => {
      if (isMouseDown) {
        const target = document.elementFromPoint(e.clientX, e.clientY);
        if (target && target.classList.contains('ascii-char')) {
          revealSpan(target);
        }
      }
    });
