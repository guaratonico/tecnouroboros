<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bolsa</title>
    <style>
        body {
            background-color: black;
            display: grid;
            grid-template-columns: auto auto;
            column-gap: 30px;
            padding: 10px;
        }


        .medicine {
            background-color: #c0c0c0;
            width: 310px;
            height: 135px;
            border-radius: 6px;
            display: grid;
            grid-template-columns: auto auto auto auto auto;
            justify-content: space-around;
        }

        .loader {
            width: 50px;
            aspect-ratio: 1;
            display: grid;
            -webkit-mask: conic-gradient(from 15deg, #0000, #000);
            animation: l26 1s infinite steps(12);
            position: relative;
            top: 10%;
        }

        .loader,
        .loader:before,
        .loader:after {
            background:
                radial-gradient(closest-side at 50% 12.5%,
                    #f5f5f5 96%, #0000) 50% 0/20% 80% repeat-y,
                radial-gradient(closest-side at 12.5% 50%,
                    #f5f5f5 96%, #0000) 0 50%/80% 20% repeat-x;
        }

        .loader:before,
        .loader:after {
            content: "";
            grid-area: 1/1;
            transform: rotate(30deg);
        }

        .loader:after {
            transform: rotate(60deg);
        }

        @keyframes l26 {
            100% {
                transform: rotate(1turn)
            }
        }
    </style>
</head>

<body>
    <a href="begonia-larorum.html" onclick="redirecionarEFechar(event, this.href)">
        <img src="images/skull.png" alt="" style="width:200px" title="M E M E N T O  M O R I">
    </a>
    <div class="medicine">
        <div class="loader"></div>
        <div class="loader"></div>
        <div class="loader"></div>
        <div class="loader"></div>
        <div class="loader"></div>
        <div class="loader"></div>
        <div class="loader"></div>
        <div class="loader"></div>
        <div class="loader"></div>
        <div class="loader"></div>
    </div>

    <script>
        function redirecionarEFechar(event, url) {
            event.preventDefault();
            if (window.opener && !window.opener.closed) {
                window.opener.location.href = url;
            } else {
                window.location.href = url;
            }
            window.close();
        }

        // Impede de entrar em Modo Tela Cheia via JS/Navegador
        document.addEventListener("fullscreenchange", () => {
            if (document.fullscreenElement) {
                document.exitFullscreen();
            }
        });

        // Impede o atalho de F11
        document.addEventListener("keydown", (event) => {
            if (event.key === "F11") {
                event.preventDefault();
            }
        });
    </script>
</body>

</html>
